<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game - Task 03</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f0c29; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; }

        .quiz-container { background: #1a1a2e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 500px; text-align: center; }
        h2 { margin-bottom: 20px; color: #00d2ff; }
        
        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .option-btn { background: #2f3542; color: white; border: 2px solid transparent; padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 1rem; text-align: left; }
        .option-btn:hover { background: #3e4451; border-color: #00d2ff; }
        
        #next-btn { background: #00d2ff; color: #0f0c29; border: none; padding: 10px 25px; border-radius: 5px; font-weight: bold; cursor: pointer; display: none; margin-top: 10px; }
        #next-btn:hover { background: #00b8e6; }

        .score-section { display: none; }
        .restart-btn { background: #2ed573; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div id="quiz">
            <h2 id="question">Question Text</h2>
            <div id="options" class="options"></div>
            <button id="next-btn">Next Question</button>
        </div>

        <div id="result" class="score-section">
            <h2>Quiz Completed!</h2>
            <p id="score-text"></p>
            <button class="restart-btn" onclick="restartQuiz()">Restart Quiz</button>
        </div>
    </div>

    <script>
        const questions = [
            { q: "Which language runs in a web browser?", a: ["Java", "C", "Python", "JavaScript"], correct: 3 },
            { q: "What does CSS stand for?", a: ["Central Style Sheets", "Cascading Style Sheets", "Control Style System"], correct: 1 },
            { q: "Which HTML tag is used for images?", a: ["<picture>", "<img>", "<src>", "<gfx>"], correct: 1 }
        ];

        let currentIdx = 0;
        let score = 0;

        const qElement = document.getElementById('question');
        const optElement = document.getElementById('options');
        const nextBtn = document.getElementById('next-btn');

        function loadQuestion() {
            resetState();
            let currentQ = questions[currentIdx];
            qElement.innerText = currentQ.q;

            currentQ.a.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerText = option;
                button.classList.add('option-btn');
                button.onclick = () => selectAnswer(index);
                optElement.appendChild(button);
            });
        }

        function resetState() {
            nextBtn.style.display = "none";
            optElement.innerHTML = "";
        }

        function selectAnswer(index) {
            const correct = questions[currentIdx].correct;
            if (index === correct) score++;
            
            // Disable buttons and show "Next"
            Array.from(optElement.children).forEach((btn, i) => {
                btn.style.pointerEvents = "none";
                btn.style.background = (i === correct) ? "#2ed573" : "#ff4757";
            });
            nextBtn.style.display = "inline-block";
        }

        nextBtn.onclick = () => {
            currentIdx++;
            if (currentIdx < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        };

        function showResult() {
            document.getElementById('quiz').style.display = "none";
            document.getElementById('result').style.display = "block";
            document.getElementById('score-text').innerText = `You scored ${score} out of ${questions.length}!`;
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            document.getElementById('quiz').style.display = "block";
            document.getElementById('result').style.display = "none";
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
